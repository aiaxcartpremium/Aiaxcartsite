<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Aiaxcart Premium | Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- (Insert your complete CSS here for .container, .tabs, .stats-grid, .card styling etc...) -->
<style>
        body { background: #fefaf7; color: #382f2c; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .container { max-width: 1100px; margin: 0 auto; padding: 0 20px; }
        .logo { font-size: 2rem; font-weight: 700; display: flex; align-items: center;}
        header { background: #FFD3D6; padding: 1.3rem 0 1.1rem 0; box-shadow: 0 6px 22px rgba(0,0,0,0.08);}
        .header-content { display: flex; justify-content: space-between; align-items: center;}
        nav ul { display: flex; list-style: none;}
        nav ul li {margin-left: 2.2rem;}
        nav ul li a { color: #382f2c; text-decoration: none; font-weight: 500; padding: 0.6rem 1.4rem; border-radius: 10px;}
        nav ul li a.active, nav ul li a:hover {background: #FFC6CA;}
        .tabs { display: flex; gap: 0.95rem; margin: 2rem 0 1.5rem 0; flex-wrap: wrap;}
        .tab {
            padding: 0.85rem 1.55rem;
            border: none;
            background: #fff;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 500;
            box-shadow: 0 1px 4px rgba(0,0,0,0.03);
            cursor: pointer;
            transition: background 0.2s;
        }
        .tab.active { background: #FFD3D6;}
        .panel { display: none; }
        .panel.active { display: block; }
        .stats-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 1.3rem; margin-bottom:2rem;}
        .stat-card { background: #fff; padding: 2rem 0 1.25rem 0; border-radius: 13px; text-align:center; box-shadow: 0 2px 8px rgba(0,0,0,0.07);}
        .stat-card h3 { font-size: 2.1rem; margin-bottom: 0.55rem; color:#FFB0B5;}
        .card { background: #fff; border-radius: 13px; box-shadow: 0 2px 8px rgba(0,0,0,0.07); padding: 2.2rem 1.5rem; margin-bottom: 2rem;}
        label { margin:1rem 0 0.45rem 0; display: block; }
        select,input[type="text"],input[type="number"],input[type="email"],input[type="date"] {
            padding:0.65rem 0.9rem;border-radius:8px;border:1px solid #E8E8E8;font-size:1rem;width:100%;font-family:inherit;
        }
        .btn {padding: 0.65rem 1.55rem; border:none; border-radius:9px; font-weight:500; font-size: 1rem; cursor:pointer;}
        .btn-primary {background: #FFB0B5; color:white;}
        .btn-danger {background: #F44336; color:white;}
        .btn-warning {background: #FF9800; color:white;}
        .btn-success {background: #43b87a; color:white;}
        .btn-small {padding:0.3rem 0.8rem;font-size:0.95rem;margin-top:0.25rem;}
        .stock-list {display:flex;flex-direction:column;gap:1.2rem;}
        .stock-card {background:#fff5; border-radius:8px; padding:1rem 1.2rem; box-shadow:0 1px 7px rgba(0,0,0,0.04);}
        .stock-actions {margin-top:0.5rem;}
        .badge {display:inline-block;padding:0.18rem 0.9rem;border-radius:12px;font-size:0.90rem; font-weight:500;}
        .badge-premium {background:#ffe3ed;color:#CC348D;}
        .badge-archived {background:#e7e6ef;color:#8c73b1;}
        .toggle-row {display:flex;align-items:center;gap:1.3rem; margin-top:0.85rem;}
        .error-message {color:red; margin-top:0.5rem;}
        .success-message {color:green; margin-top:0.5rem;}
        #owner-modal{position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.37);display:flex;align-items:center;justify-content:center;z-index:9999;}
        .modal-card{position:relative;background:white;padding:2.7rem 2.5rem 1.5rem 2.5rem;border-radius:16px;min-width:325px;}
        .close-btn{position:absolute;top:0.6rem;right:0.7rem;background:none;border:none;font-size:1.55rem;color:#ff7a7a;line-height:1;cursor:pointer;}
        @media(max-width:1000px){.stats-grid{grid-template-columns:1fr 1fr;}}
        @media(max-width:700px){.stats-grid{grid-template-columns:1fr;}.tabs{gap:0.45rem;}}
    </style>
</head>
<body>
<header>
    <div class="container header-content">
        <div class="logo">🛒 Aiaxcart Premium</div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="admin.html" class="active">Admin</a></li>
            </ul>
        </nav>
    </div>
</header>
<!-- Owner Verification Modal -->
<div class="owner-veri-overlay" id="ownerVeriOverlay">
    <div class="modal-card">
        <button onclick="closeOwnerModal()" class="close-btn">&times;</button>
        <h2>🔐 Owner Verification</h2>
        <input type="text" id="ownerUidInput" placeholder="Enter Owner UID" style="width:100%;margin-bottom:1.3rem;">
        <button onclick="verifyOwnerUID()" style="background:#FFB0B5;color:white;padding:0.65rem 1.5rem;width:100%;border:none;border-radius:8px;">Verify Access</button>
        <div id="ownerVeriMsg" style="color:red;margin-top:0.8rem;font-size:1.1em;"></div>
    </div>
</div>
<div class="container" id="admin-dashboard" style="display:none;">
    <h1 style="margin-top:2rem;">Admin Console</h1>
    <div class="stats-grid">
        <div class="stat-card"><h3 id="stat-products">0</h3><div>Products</div></div>
        <div class="stat-card"><h3 id="stat-stock">0</h3><div>Available Stock</div></div>
        <div class="stat-card"><h3 id="stat-pending">0</h3><div>Pending Orders</div></div>
        <div class="stat-card"><h3 id="stat-revenue">₱0</h3><div>Total Revenue</div></div>
    </div>
    <div class="tabs">
        <button class="tab active" data-tab="add-stock">Add Stock</button>
        <button class="tab" data-tab="manage-stocks">Manage Stocks</button>
        <button class="tab" data-tab="pending-orders">Pending Orders</button>
        <button class="tab" data-tab="sold-accounts">Sold Accounts</button>
        <button class="tab" data-tab="archived-stocks">Archived Stocks</button>
        <button class="tab" data-tab="products">Products</button>
        <button class="tab" data-tab="store-rules">Store Rules</button>
        <button class="tab" data-tab="records">Add Record</button>
        <button class="tab" data-tab="reports">Reports</button>
    </div>
    <!-- Panels -->
    <div id="panel-add-stock" class="panel active"><div class="card">
        <form id="addStockForm">
            <label>Product
                <select id="stock-product"></select>
            </label>
            <label>Account Type
                <select id="stock-type"></select>
            </label>
            <label>Duration
                <select id="stock-duration"></select>
            </label>
            <label>Quantity <input type="number" id="stock-qty" value="1" min="1"></label>
            <label>Email <input type="text" id="stock-email"></label>
            <label>Password <input type="text" id="stock-password"></label>
            <label>Profile <input type="text" id="stock-profile"></label>
            <label>PIN <input type="text" id="stock-pin"></label>
            <label>Auto-Archive (Days): <input type="number" id="stock-arch" value="0"></label>
            <label>Premium At (date, optional): <input type="date" id="stock-premdate"></label>
            <button class="btn btn-primary" style="margin-top:1rem;">Add Stock</button>
        </form>
        <div id="add-stock-msg"></div>
    </div></div>
    <div id="panel-manage-stocks" class="panel"><div class="card" id="manage-stocks-list"></div></div>
    <div id="panel-pending-orders" class="panel"><div class="card" id="pending-orders-list"></div></div>
    <div id="panel-sold-accounts" class="panel"><div class="card" id="sold-list"></div></div>
    <div id="panel-archived-stocks" class="panel"><div class="card" id="archived-list"></div></div>
    <div id="panel-products" class="panel"><div class="card" id="products-list"></div></div>
    <div id="panel-store-rules" class="panel"><div class="card" id="rules-list"></div></div>
    <div id="panel-records" class="panel"><div class="card" id="records-list"></div></div>
    <div id="panel-reports" class="panel"><div class="card" id="reports-list"></div></div>
</div>
<script>
const PRODUCTS = [
 "Netflix Premium","Viu Premium","VIVAMAX VIVAONE","WeTV","IWANT TFC","Crunchyroll","Disney+","Bilibili","Loklok","iQiyi",
 "HBO Max","Amazon Prime","Youku","NBA League Pass Premium","YouTube Premium","Spotify Premium","Apple Music","ChatGPT Plus",
 "Blackbox AI","Perplexity AI","Google One + Gemini AI","Quizlet+","Scribd Premium","Studocu Premium","Duolingo Super",
 "Turnitin Student","Turnitin Instructor","Canva Pro","Picsart Gold","CapCut Pro","Alight Motion Pro","Remini Web",
 "Grammarly Premium","Quillbot Premium","Microsoft 365","CamScanner Pro","Small PDF Pro","Zoom Pro"
];
const ACC_TYPES = ["Solo Account","Shared Account","Solo Profile","Shared Profile"];
const DURATIONS = ["7d","14d","1m","2m","3m","4m","5m","6m","7m","8m","9m","10m","11m","12m","24m","NW","3m W","6m W","12m W"];
let stocks = JSON.parse(localStorage.getItem("stocks")||"[]");
let products = JSON.parse(localStorage.getItem("products")||"[]");
if(products.length===0){products=PRODUCTS.slice(0,10);localStorage.setItem("products",JSON.stringify(products));}
let rules = JSON.parse(localStorage.getItem("rules")||'["All accounts premium","No refunds after delivery"]');
let records = JSON.parse(localStorage.getItem("records")||"[]");
let archived = JSON.parse(localStorage.getItem("archived")||"[]");
let sold = JSON.parse(localStorage.getItem("sold")||"[]");
let pending = JSON.parse(localStorage.getItem("pending")||"[]");
function saveAll(){
        localStorage.setItem("stocks",JSON.stringify(stocks));
        localStorage.setItem("products",JSON.stringify(products));
        localStorage.setItem("rules",JSON.stringify(rules));
        localStorage.setItem("records",JSON.stringify(records));
        localStorage.setItem("archived",JSON.stringify(archived));
        localStorage.setItem("sold",JSON.stringify(sold));
        localStorage.setItem("pending",JSON.stringify(pending));
}
// Owner UID verification logic
const OWNER_UID = '26baf1ad-64b1-436c-9758-c415949dfa0a';
function openOwnerModal(){document.getElementById('ownerUidInput').value='';document.getElementById('ownerVeriMsg').textContent='';document.getElementById("ownerVeriOverlay").style.display="flex";}
function closeOwnerModal(){document.getElementById("ownerVeriOverlay").style.display="none";}
function verifyOwnerUID(){
    let uid=document.getElementById('ownerUidInput').value.trim();
    if(uid===OWNER_UID){
        localStorage.setItem('ownerVerified','yes');
        closeOwnerModal();
        showAdminPanel();
    }else{
        document.getElementById('ownerVeriMsg').textContent='❌ Invalid UID.';
    }
}
function showAdminPanel(){
    document.getElementById('admin-dashboard').style.display='block';
    updateStats();showStocks();showArchived();showProducts();showRules();showRecords();showReports();showPending();showSold();
}
document.addEventListener("DOMContentLoaded",function(){
    // Tab switching
    let t=document.querySelectorAll(".tab"),p=document.querySelectorAll(".panel");
    t.forEach(tab=>tab.onclick=function(){
        t.forEach(tb=>tb.classList.remove("active"));
        p.forEach(pl=>pl.classList.remove("active"));
        tab.classList.add("active");
        document.getElementById("panel-"+tab.dataset.tab).classList.add("active");
        showAdminPanel();
    });
    // Setup selects
    document.getElementById("stock-product").innerHTML=products.map(x=>`<option>${x}</option>`).join('');
    document.getElementById("stock-type").innerHTML=ACC_TYPES.map(x=>`<option>${x}</option>`).join('');
    document.getElementById("stock-duration").innerHTML=DURATIONS.map(x=>`<option>${x}</option>`).join('');
    if(localStorage.getItem('ownerVerified')!=='yes'){openOwnerModal();}else{showAdminPanel();}
    // Add stock
    document.getElementById("addStockForm").onsubmit=function(e){
      e.preventDefault();
      let qty=Number(document.getElementById("stock-qty").value)||1;
      for(let i=0;i<qty;i++){
        stocks.push({
            id:Date.now()+(""+Math.floor(Math.random()*10000)),
            product:document.getElementById("stock-product").value,
            type:document.getElementById("stock-type").value,
            duration:document.getElementById("stock-duration").value,
            email:document.getElementById("stock-email").value,
            password:document.getElementById("stock-password").value,
            profile:document.getElementById("stock-profile").value,
            pin:document.getElementById("stock-pin").value,
            archiveAfter:Number(document.getElementById("stock-arch").value)||0,
            premiumAt:document.getElementById("stock-premdate").value||"",
            status:'available'
        });
      }
      saveAll();this.reset();updateStats();showStocks();
      document.getElementById("add-stock-msg").textContent="✔ Added!";
      setTimeout(()=>document.getElementById("add-stock-msg").textContent='',1500);
    };
});

// Panel logic
function updateStats(){
    document.getElementById("stat-products").innerText=products.length;
    document.getElementById("stat-stock").innerText=stocks.filter(s=>s.status==='available').length;
    document.getElementById("stat-pending").innerText=pending.length;
    document.getElementById("stat-revenue").innerText="₱"+sold.reduce((a,b)=>a+(+b.price||0),0);
}
function showStocks(){
    let s=stocks.filter(s=>s.status==='available');
    document.getElementById("manage-stocks-list").innerHTML=s.length?s.map(st=>`<div><b>${st.product}</b> ${st.type} (${st.duration})<br>Email:${st.email}<br><button onclick="markSold('${st.id}')">Mark Sold</button> <button onclick="delStock('${st.id}')">Delete</button> <button onclick="archiveStock('${st.id}')">Archive</button></div><hr>`).join(''):"No stocks.";
}
function delStock(id){stocks=stocks.filter(s=>s.id!=id);saveAll();showStocks();}
function archiveStock(id){
    let idx=stocks.findIndex(s=>s.id==id);
    if(idx>-1){archived.push({...stocks[idx],archivedAt:(new Date()).toLocaleDateString()});stocks.splice(idx,1);saveAll();showStocks();showArchived();}
}
function markSold(id){let x=stocks.find(s=>s.id==id);if(x){sold.push({...x,price:199});delStock(id);saveAll();updateStats();showSold();}}
function showArchived(){document.getElementById("archived-list").innerHTML=archived.length?archived.map(a=>`<div>${a.product}, ${a.type}, archived at: ${a.archivedAt}</div>`).join(''):"No archived stocks";}
function showPending(){document.getElementById("pending-orders-list").innerHTML=pending.length?pending.map(p=>`<div>${p.product}, order: ${p.orderId}</div>`).join(''):"No pending orders.";}
function showSold(){document.getElementById("sold-list").innerHTML=sold.length?sold.map(x=>`<div>${x.product}, buyer, price ₱${x.price||0}</div>`).join(''):"No sold accounts yet";}
function showProducts(){document.getElementById("products-list").innerHTML=products.length?products.map((p,i)=>`<div>${i+1}. ${p} <button onclick="delProd(${i})">Delete</button></div>`).join(''):"No products.";}
function delProd(idx){products.splice(idx,1);saveAll();showProducts();updateStats();}
function showRules(){document.getElementById("rules-list").innerHTML=rules.length?rules.map((r,i)=>`<div>${r} <button onclick="delRule(${i})">Remove</button></div>`).join(''):"No Rules.";}
function delRule(idx){rules.splice(idx,1);saveAll();showRules();}
function showRecords(){document.getElementById("records-list").innerHTML=records.length?records.map(r=>`<div>${r.id} ${r.buyer} | ${r.product} | Exp: ${r.exp}</div>`).join(''):"No records.";}
function showReports(){document.getElementById("reports-list").innerHTML="No customer reports yet.";}
</script>
</body>
</html>
