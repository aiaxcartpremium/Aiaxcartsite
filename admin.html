<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Console - Aiaxcart Premium</title>
    <style>
        /* (Your full CSS comes here, unchanged—for brevity not repeated, use your original CSS from paste.txt) */
        /* Just keep all of your paste.txt <style> content here */
    </style>
</head>
<body>
    <header>
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <i>🛒</i> Aiaxcart Premium
                </div>
                <nav>
                    <ul>
                        <li><a href="index.html">Home</a></li>
                        <li><a href="admin.html" class="active">Admin</a></li>
                    </ul>
                </nav>
                <div class="auth-buttons">
                    <button id="login-btn" class="btn btn-outline d-none">Login / Sign up</button>
                    <a href="index.html" id="my-account-btn" class="btn btn-primary d-none">My Account</a>
                    <button id="logout-btn" class="btn btn-outline d-none">Logout</button>
                </div>
            </div>
        </div>
    </header>
    <main>
        <div class="container">
            <div id="admin-page">
                <h1 class="mb-2">Admin Console</h1>
                <!-- Admin Login -->
                <div id="admin-login" class="card">
                    <h2 class="card-title">Admin Login</h2>
                    <div id="admin-message"></div>
                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <input type="email" id="admin-email" class="form-control" placeholder="admin@aiaxcart.com">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Password</label>
                        <input type="password" id="admin-password" class="form-control" placeholder="admin123">
                    </div>
                    <button id="admin-signin-btn" class="btn btn-primary w-100">Sign In</button>
                </div>

                <!-- Admin Dashboard -->
                <div id="admin-dashboard" class="d-none">
                    <!-- Tabs -->
                    <div class="tabs">
                        <button class="tab active" data-tab="add-stock">Add Stock</button>
                        <button class="tab" data-tab="manage-stocks">Manage Stocks</button>
                        <button class="tab" data-tab="pending-orders">Pending Orders</button>
                        <button class="tab" data-tab="sold-accounts">Sold Accounts</button>
                        <button class="tab" data-tab="archived-stocks">Archived Stocks</button>
                        <button class="tab" data-tab="products">Products</button>
                        <button class="tab" data-tab="store-rules">Store Rules</button>
                        <button class="tab" data-tab="records">Add Record</button>
                        <button class="tab" data-tab="reports">Reports</button>
                        <button class="tab" data-tab="settings">Settings</button>
                    </div>
                    <!-- All your original tab panels go here, unchanged except ... -->

                    <!-- Add Record Panel -->
                    <section id="panel-records" class="panel">
                        <div class="card">
                            <h2>➕ Add Buyer Record</h2>
                            <div style="display:flex;gap:1rem;margin-bottom:1rem;">
                                <button class="btn" id="autoModeBtn" onclick="switchRecordMode(true)">Automatic (Site Order)</button>
                                <button class="btn" id="manualModeBtn" onclick="switchRecordMode(false)">Manual (Other Platforms)</button>
                            </div>
                            <form id="record-form" onsubmit="addRecord(event)">
                                <div>
                                    <label>Source:
                                        <select id="record-source" onchange="sourceChanged()">
                                            <option value="site">Site (Automatic)</option>
                                            <option value="tg">Telegram</option>
                                            <option value="ig">Instagram</option>
                                            <option value="fb">Facebook</option>
                                            <option value="other">Other</option>
                                        </select>
                                    </label>
                                </div>
                                <div>
                                    <label>Sales/Order ID:<input type="text" id="record-id" required></label>
                                </div>
                                <div>
                                    <label>Buyer Name/Email:<input type="text" id="record-buyer" required></label>
                                </div>
                                <div id="socmed-link-wrap" style="display:none;">
                                    <label>Buyer Social Link:<input type="url" id="record-socmed"></label>
                                </div>
                                <div>
                                    <label>Product:<input type="text" id="record-product" required></label>
                                </div>
                                <div>
                                    <label>Subs Type:<input type="text" id="record-substype" required></label>
                                </div>
                                <div>
                                    <label>Email/Login:<input type="text" id="record-email" required></label>
                                    <label>Password:<input type="text" id="record-password" required></label>
                                    <label>PIN:<input type="text" id="record-pin"></label>
                                    <label>Profile:<input type="text" id="record-profile"></label>
                                    <label>Product Key:<input type="text" id="record-prodkey"></label>
                                </div>
                                <div>
                                    <label>Current Expiration:<input type="date" id="record-expiration" required></label>
                                    <span style="margin:0 1rem;">
                                      <button type="button" class="btn btn-warning btn-small" onclick="addDaysSubs()">Add Days/Subs</button>
                                    </span>
                                    <span id="new-exp-wrap" style="font-weight:bold;"></span>
                                </div>
                                <div>
                                    <label>Notes/Details:<textarea id="record-notes" rows="2"></textarea></label>
                                </div>
                                <button type="submit" class="btn btn-primary full-width">💾 Save Record</button>
                            </form>
                            <div id="record-message"></div>
                        </div>
                        <div class="card">
                            <h3>Records (Latest)</h3>
                            <div id="records-list"></div>
                        </div>
                    </section>

                    <!-- Reports Panel -->
                    <section id="panel-reports" class="panel">
                        <div class="card">
                            <h2>📊 Customer Reports & Issues</h2>
                            <button onclick="loadReports()" class="btn btn-primary btn-small">Refresh</button>
                            <div id="reports-list" style="margin-top:1.5rem;">
                                <p class="text-muted">No reports yet.</p>
                            </div>
                        </div>
                    </section>

                    <!-- Settings Panel -->
                    <section id="panel-settings" class="panel">
                        <div class="card">
                            <h2>⚙️ Settings</h2>
                            <p><strong>Owner UID:</strong> 26baf1ad-64b1-436c-9758-c415949dfa0a</p>
                            <p><strong>Session:</strong> Active</p>
                            <button onclick="clearCache()" class="btn btn-danger">🗑️ Clear Cache</button>
                        </div>
                    </section>
                </div>
            </div>
        </div>
    </main>
    <script>
        /* (All your original admin/admin panel JS goes here...) */

        // --- Add Record/Reports/Settings logic ---
        let recordsData = JSON.parse(localStorage.getItem('recordsData')||'[]');
        let isAutoMode = true;
        function switchRecordMode(auto) {
            isAutoMode=auto;
            document.getElementById('autoModeBtn').classList.toggle('btn-primary', auto);
            document.getElementById('manualModeBtn').classList.toggle('btn-primary', !auto);
            document.getElementById('record-source').value=auto?'site':'tg';
            sourceChanged();
        }
        function sourceChanged() {
            let source = document.getElementById('record-source').value;
            if (source==='site') {
                document.getElementById('socmed-link-wrap').style.display='none';
                document.getElementById('record-buyer').placeholder='(Auto-filled)';
            } else {
                document.getElementById('socmed-link-wrap').style.display='';
                document.getElementById('record-buyer').placeholder='Name or Email';
            }
        }
        function addDaysSubs() {
            let days = prompt("How many days to add?");
            days = parseInt(days);
            let dateInput = document.getElementById('record-expiration');
            if (!dateInput.value || isNaN(days)) return;
            let expDate = new Date(dateInput.value);
            expDate.setDate(expDate.getDate() + days);
            document.getElementById('new-exp-wrap').textContent = 'New Expiration: '+expDate.toISOString().slice(0,10);
            dateInput.value = expDate.toISOString().slice(0,10);
        }
        function addRecord(e) {
            e.preventDefault();
            let r = {
                id: document.getElementById('record-id').value,
                buyer: document.getElementById('record-buyer').value,
                source: document.getElementById('record-source').value,
                socmed: document.getElementById('record-socmed').value,
                product: document.getElementById('record-product').value,
                substype: document.getElementById('record-substype').value,
                email: document.getElementById('record-email').value,
                password: document.getElementById('record-password').value,
                pin: document.getElementById('record-pin').value,
                profile: document.getElementById('record-profile').value,
                prodkey: document.getElementById('record-prodkey').value,
                expiration: document.getElementById('record-expiration').value,
                notes: document.getElementById('record-notes').value,
                date: new Date().toLocaleDateString()
            };
            recordsData.unshift(r);
            localStorage.setItem('recordsData', JSON.stringify(recordsData));
            document.getElementById('record-message').innerHTML='<span class="success-message">✅ Record saved!</span>';
            setTimeout(()=>{document.getElementById('record-message').innerHTML='';},2000);
            document.getElementById('record-form').reset();
            document.getElementById('new-exp-wrap').textContent='';
            loadRecordsList();
        }
        function loadRecordsList() {
            let list = document.getElementById('records-list');
            if (!recordsData.length) { list.innerHTML='<p class="text-muted">No records yet.</p>'; return; }
            list.innerHTML = recordsData.slice(0,10).map(r=>`
                <div style="border:1px solid #FFD3D6;border-radius:12px;padding:1rem;margin-bottom:1rem;">
                    <strong>ID:</strong> ${r.id} <br>
                    <strong>Buyer:</strong> ${r.buyer} <br>
                    <strong>Source:</strong> ${r.source} ${r.socmed?`<br><strong>Socmed:</strong> <a href="${r.socmed}" target="_blank">${r.socmed}</a>`:''}
                    <br><strong>Product:</strong> ${r.product} (${r.substype})
                    <br><strong>Email:</strong> ${r.email}
                    <br><strong>Pass:</strong> ${r.password}
                    <br><strong>PIN/Profile/ProductKey:</strong> ${r.pin}/${r.profile}/${r.prodkey}
                    <br><strong>Expiration:</strong> ${r.expiration} 
                    <br><strong>Notes:</strong> ${r.notes||''}
                    <br><span class="text-muted">${r.date}</span>
                </div>
            `).join('');
        }
        document.addEventListener('DOMContentLoaded',loadRecordsList);

        // --- Reports ---
        function loadReports() {
            const reports = JSON.parse(localStorage.getItem('reports')||'[]');
            const list = document.getElementById('reports-list');
            if(reports.length===0){list.innerHTML='<p class="text-muted">No reports yet.</p>';return;}
            list.innerHTML = reports.map(report => `
                <div class="order-item">
                    <strong>${report.customer || ''}</strong> - ${report.issue || ''}
                    <br><small>${report.date || ''}</small>
                    <br><button class="btn btn-primary btn-small">Respond</button>
                </div>
            `).join('');
        }

        // --- Settings ---
        function clearCache() {
            if(confirm('Clear all cached data?')){localStorage.clear();alert('Cache cleared!');location.reload();}
        }

        /* (The rest of your admin functions, stocks/products/rule, etc stay BELOW here, unchanged) */
    </script>
</body>
</html>
